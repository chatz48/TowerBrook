name: Web CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

defaults:
  run:
    working-directory: apps/web

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Install backend test dependencies
        run: python -m pip install -e "apps/backend-api[test]"
        working-directory: .

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Backend tests
        run: pnpm api:test
        working-directory: .

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start app and run Playwright smoke tests
        run: |
          set -euo pipefail
          pnpm start &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/ > /dev/null; then
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server failed to start on http://localhost:3000"
              exit 1
            fi
            sleep 2
          done
          BASE_URL=http://localhost:3000 pnpm test:e2e:ci --grep @smoke

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
